[package]
name = "fastmath"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
libadwaita = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
gio = "0.22"
# For logging with the GLib log macros
glib = { version = "0.22", features = ["log_macros"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
i18n-format = { version = "0.5", features = ["legacy"] }
# For the leaderboard files
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For generating the questions
fastrand = "2"

[build-dependencies]
glib-build-tools = "0.22"
regex = "1.11"
